{% extends "base.html" %}
{% block content %}
<h3><i class="fas fa-bell"></i> {{ t('notif_title') }}</h3>
<ul class="list-group">
    {% for n in notifications %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ n.message }}
        <span class="badge bg-secondary rounded-pill">{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
    </li>
    {% else %}
    <li class="list-group-item text-center text-muted">{{ t('no_notif') }}</li>
    {% endfor %}
</ul>
<a href="/shop/dashboard" class="btn btn-secondary mt-3"><i class="fas fa-arrow-left"></i> {{ t('dashboard') }}</a>
{% endblock %}
