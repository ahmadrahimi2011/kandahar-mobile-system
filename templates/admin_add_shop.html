{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
    <div class="card"><div class="card-body">
        <h3><i class="fas fa-user-plus"></i> Add New Shop / User (Admin)</h3>
        <p class="text-muted">Fill all details to create a shop account.</p>
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">{{ t('shop_name') }}</label>
                    <input class="form-control" name="shop_name" placeholder="e.g. Rahimi Mobile" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">{{ t('shop_phone') }}</label>
                    <input class="form-control" name="contact" placeholder="e.g. 0700123456" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('shop_address') }}</label>
                <input class="form-control" name="location" placeholder="e.g. Main Bazaar, Kandahar" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" name="email" type="email" placeholder="shop@example.com">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">{{ t('username') }}</label>
                    <input class="form-control" name="username" placeholder="Login ID" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">{{ t('password') }}</label>
                <input class="form-control" name="password" type="password" placeholder="Minimum 6 characters" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Assign Role</label>
                <select class="form-select" name="role">
                    <option value="shop">👤 Normal Shop User</option>
                    <option value="admin">👑 Administrator (Full Control)</option>
                </select>
            </div>
            <button class="btn btn-success w-100"><i class="fas fa-save"></i> Add Shop</button>
        </form>
    </div></div>
</div></div>
{% endblock %}
