{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
    <div class="card"><div class="card-body">
        <h3 class="text-center">{{ t('shop_login') }}</h3>
        <form method="POST">
            <div class="mb-3"><input class="form-control" name="username" placeholder="{{ t('username') }}" required></div>
            <div class="mb-3"><input class="form-control" name="password" type="password" placeholder="{{ t('password') }}" required></div>
            <button class="btn btn-primary w-100">{{ t('login_btn') }}</button>
        </form>
        <p class="text-center mt-3 text-muted">{{ t('contact_admin') }}</p>
    </div></div>
</div></div>
{% endblock %}
